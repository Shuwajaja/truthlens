name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      viewer: ${{ steps.detect.outputs.viewer }}
      python: ${{ steps.detect.outputs.python }}
      extra_tests: ${{ steps.detect.outputs.extra_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CI scope and aggregate behavior
        run: python3 -m unittest tests.test_ci_scope -q
      - name: Detect changed components
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/ci_scope.py detect
  viewer:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.viewer == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:styles --if-present
      - run: npm run check:language
      - run: npm run check:theme
      - run: node --check ../integrations/agent-zero-acp/audit-status.cjs
      - run: node --test ../integrations/agent-zero-acp/audit-status.test.cjs
      - run: npx vitest run
      - run: npm run build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          for f in README.md docs/INVENTORY.md docs/ARCHITECTURE.md docs/TRUST-LEVELS.md docs/spec/event-schema-v1.md docs/spec/artifact-manifest-v1.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: README links, hero and private-detail tripwires (offline)
        run: python3 -m unittest tests.test_readme -q
  test:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - name: Fast deterministic unit tests
        run: python3 .github/ci_scope.py baseline-tests
      - name: Changed and related regression tests
        env:
          EXTRA_TESTS: ${{ needs.scope.outputs.extra_tests || '[]' }}
        run: python3 .github/ci_scope.py extra-tests
  required:
    name: CI required checks
    needs: [scope, viewer, docs, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful evidence for every needed job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VIEWER_NEEDED: ${{ needs.scope.outputs.viewer }}
          PYTHON_NEEDED: ${{ needs.scope.outputs.python }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
          PYTHON_RESULT: ${{ needs.test.result }}
        run: python3 .github/ci_scope.py check
