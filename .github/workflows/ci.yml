name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:styles --if-present
      - run: npm run check:language
      - run: npm run check:theme
      - run: npx vitest run
      - run: npm run build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist (placeholder until W1)
        run: |
          for f in README.md docs/INVENTORY.md docs/ARCHITECTURE.md docs/TRUST-LEVELS.md docs/spec/event-schema-v1.md docs/spec/artifact-manifest-v1.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - name: Fast deterministic unit tests
        run: pytest -q tests/test_canonical.py tests/test_redaction.py tests/test_ledger.py tests/test_manifest.py tests/test_audit.py tests/test_audit_inputs.py
